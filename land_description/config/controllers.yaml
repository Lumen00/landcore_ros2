# Instantiate controller manager and tell it
# which controllers will be defined.
controller_manager:
  ros__parameters:
    update_rate: 50 # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

# Set up the mecanum controller.
mecanum_drive_controller:
  ros__parameters:
    # Tell the controller which URDF joint name velocity commands are sent to.
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "back_left_wheel_joint"
    rear_right_wheel_command_joint_name: "back_right_wheel_joint"
    
    kinematics:
      base_frame_offset: {x: 0.0, y: 0.0, theta: 0.0}
      wheels_radius: 0.04
      su,_of_robot_center_projection_on_X_Y_axis: 0.2265
    
    # If no commands received for timeout, stop.
    reference_timeout: 0.5

    # Tell the controller manager the names of the base and odom links.
    base_frame_id: base_link
    odom_frame_id: odom
    # Broadcast the odom -> base_link transform.
    enable_odom_tf: true
    publish_rate: 50.0

    # Uncertainty estimate in xyzrpy.
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]